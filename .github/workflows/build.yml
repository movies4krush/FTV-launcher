name: Build Firestick APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Android XML Namespaces
        run: |
          P1="http://schemas."
          P2="://android.com"
          find app/src/main -name "*.xml" -exec sed -i "s|http://android.com|${P1}${P2}|g" {} +

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: firestick-launcher-apk
          path: app/build/outputs/apk/debug/*.apk
          
