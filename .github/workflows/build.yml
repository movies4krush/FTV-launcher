name: Build Firestick APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Android XML Namespaces
        run: python3 -c "import glob, base64; u = base64.b64decode('aHR0cDovL3NjaGVtYXMuYW5kcm9pZC5jb20vYXBrL3Jlcy9hbmRyb2lk').decode(); [open(f, 'w').write(open(f).read().replace('http://android.com', u)) for f in glob.glob('app/src/main/**/*.xml', recursive=True)]"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: firestick-launcher-apk
          path: app/build/outputs/apk/debug/*.apk
          
